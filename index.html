<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card - iMerch Media Inc.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .card-glow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1), 0 0 20px rgba(79, 70, 229, 0.05);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex items-center justify-center min-h-screen p-4 text-slate-800">

    <div class="bg-white/95 backdrop-blur-xl w-full max-w-md rounded-3xl card-glow overflow-hidden p-6 sm:p-8 text-center border border-white/20 transition-all duration-300">
        
        <!-- Loading state na may modern spinner -->
        <div id="loading" class="py-16">
            <div class="inline-block w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-500 font-medium animate-pulse">Inihahanda ang Digital Card...</p>
        </div>

        <!-- Card Content (Naka-hide muna habang kinukuha ang data) -->
        <div id="cardContent" class="hidden">
            
            <!-- Verified Badge / Header Accent -->
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-xs font-semibold mb-4 tracking-wider uppercase">
                <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
                Official Digital Business Card
            </div>

            <!-- Larawan / Business Card Image na may Modern Frame -->
            <div class="mb-6 group relative">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-rose-500 rounded-2xl blur opacity-25 group-hover:opacity-40 transition duration-300"></div>
                <div class="relative bg-white rounded-2xl overflow-hidden shadow-md border border-slate-100">
                    <img id="profileImg" src="" alt="Business Card" class="w-full h-auto object-cover transform transition duration-500 hover:scale-[1.02]">
                </div>
            </div>

            <!-- Profile Info -->
            <h1 id="fullName" class="text-2xl font-bold text-slate-900 tracking-tight"></h1>
            <p id="jobTitle" class="text-indigo-600 font-semibold text-sm mt-1 uppercase tracking-wider"></p>
            <p id="company" class="text-slate-400 text-xs font-medium mb-8 pb-4 border-b border-slate-100"></p>

            <!-- Action Buttons na may Modern Hover Effects -->
            <div class="space-y-3">
                <!-- Button para i-save ang contact number sa phone -->
                <button onclick="saveContact()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 flex items-center justify-center gap-2.5 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    I-save sa Contacts
                </button>

                <!-- Button para i-download ang mismong Business Card image -->
                <a id="downloadCardBtn" href="#" download class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2.5 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    I-download ang Card Image
                </a>

                <!-- Button para sa Tawag -->
                <a id="callBtn" href="#" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 active:scale-[0.98] font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-sm border border-emerald-200/60">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    Tawagan / Call
                </a>
            </div>

            <!-- Footer Branding -->
            <div class="mt-8 text-[11px] text-slate-400 font-medium tracking-wide">
                Powered by iMerch Media Inc. Digital System
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden py-12">
            <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center mx-auto mb-3 text-xl font-bold">!</div>
            <p class="text-rose-600 font-semibold text-sm">Hindi nahanap ang business card o may mali sa link.</p>
            <p class="text-slate-400 text-xs mt-1">Mangyaring suriin ang QR code o ang link na ginamit.</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyub_u9y9a4HUM5eTa4lYq-SQ8XeWNk1nC0A4AG-UXIEmJeymTimFJ76qwIgCjzYYQ6EA/exec";

        let contactData = {};
        let cardImageUrl = "";

        async function fetchCardData() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_URL}?id=${id}`);
                const data = await response.json();

                if (!data.FullName) {
                    throw new Error("No data found");
                }

                contactData = data;

                // Ipakita ang data sa UI
                document.getElementById('fullName').innerText = data.FullName;
                document.getElementById('jobTitle').innerText = data.JobTitle;
                document.getElementById('company').innerText = data.Company;
                
                // Set Image URL
                cardImageUrl = data.PhotoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60";
                const imgElement = document.getElementById('profileImg');
                imgElement.src = cardImageUrl;

                // I-set ang download link para sa business card image button
                const downloadCardBtn = document.getElementById('downloadCardBtn');
                downloadCardBtn.href = cardImageUrl;
                downloadCardBtn.setAttribute('download', `${data.FullName.replace(/\s+/g, '_')}_BusinessCard.jpg`);

                document.getElementById('callBtn').href = `tel:${data.Phone}`;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('cardContent').classList.remove('hidden');

            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
            }
        }

        async function saveContact() {
            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `FN:${contactData.FullName}`,
                `N:${contactData.FullName};;;;`,
                `TITLE:${contactData.JobTitle}`,
                `ORG:${contactData.Company}`,
                `TEL;TYPE=WORK,VOICE:${contactData.Phone}`,
                `EMAIL;TYPE=PREF,INTERNET:${contactData.Email}`,
                contactData.Website ? `URL:${contactData.Website}` : "",
                "END:VCARD"
            ].filter(Boolean).join("\r\n");

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const file = new File([blob], `${contactData.FullName.replace(/\s+/g, '_')}.vcf`, { type: 'text/vcard' });

            // Subukang gamitin ang Web Share API para direktang lumabas ang contact option sa mobile
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: `Contact: ${contactData.FullName}`,
                        text: `I-save ang contact details ni ${contactData.FullName} (${contactData.JobTitle} ng ${contactData.Company})`,
                        files: [file],
                    });
                    return;
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.log('Share fallback to download', error);
                    } else {
                        return; // Kung kinansela ng user ang share sheet
                    }
                }
            }

            // Fallback kung sakaling hindi suportado ng browser: awtomatikong mag-download
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${contactData.FullName.replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        fetchCardData();
    </script>
</body>
</html>
